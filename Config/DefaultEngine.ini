; Generated by the DreamGUI rename. Maps every reflected type back to the name it had as
; LGUI/LexUI, so assets saved against the old names still resolve.
;
; Regenerate with scratchpad/build/gen_redirects.py rather than editing by hand.

[CoreRedirects]
; ---------------------------------------------------------------------------
; P4-d, 2026-08-29. NOT generated by gen_redirects.py (that one maps LGUI/LexUI
; to Dream); these are the second rename, from the prefab vocabulary the class
; model replaced. Hand-written, and hand-written is the point: every entry below
; is a type some already-saved asset still names, and a missing one costs data
; the moment that asset is resaved.
+ClassRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequence",NewName="/Script/DreamGUI.DreamWidgetAnimation")
+ClassRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequenceComponent",NewName="/Script/DreamGUI.DreamWidgetAnimationComponent")
+ClassRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequencePlayer",NewName="/Script/DreamGUI.DreamWidgetAnimationPlayer")
+ClassRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabPresenterComponent",NewName="/Script/DreamGUI.DreamWidgetPresenterComponent")
+ClassRedirects=(OldName="/Script/DreamGUIEditor.DreamUIPrefabEdMode",NewName="/Script/DreamGUIEditor.DreamWidgetDesignerEdMode")
+ClassRedirects=(OldName="/Script/DreamGUIEditor.DreamUIPrefabSequencerSettings",NewName="/Script/DreamGUIEditor.DreamWidgetAnimationSequencerSettings")
+StructRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequenceObjectReference",NewName="/Script/DreamGUI.DreamWidgetAnimationObjectReference")
+StructRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequenceObjectReferences",NewName="/Script/DreamGUI.DreamWidgetAnimationObjectReferences")
+StructRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequenceObjectReferenceMap",NewName="/Script/DreamGUI.DreamWidgetAnimationObjectReferenceMap")

; The content mount and the script module, which cover every path-shaped reference.
; "..." is the wildcard marker: a trailing one makes it a prefix match. MatchSubstring is deprecated.
+PackageRedirects=(OldName="/LGUI...",NewName="/DreamGUI...",MatchWildcard=true)
+PackageRedirects=(OldName="/Script/LGUI",NewName="/Script/DreamGUI")
+PackageRedirects=(OldName="/Script/LGUIEditor",NewName="/Script/DreamGUIEditor")
+PackageRedirects=(OldName="/Script/LTween",NewName="/Script/DreamTween")

; WHY THE LGUI ENTRIES ABOVE POINT AT THE CURRENT NAMES AND NOT THE INTERMEDIATE ONES:
; CoreRedirects are applied ONCE. A redirect whose target is itself the OldName of
; another redirect does not chain -- the loader takes one hop and stops. An asset saved
; in the LGUI days names LexUIPrefabSequenceComponent, so the LGUI entry has to name the
; class that exists TODAY. Adding a second Dream->Dream hop looked right, built clean,
; and left the animation on BP_NewLexUIPrefab failing to load with "because its class
; does not exist"; a control build against the previous commit is what proved it was new.
; The Dream->Dream entries are kept for assets saved between the two renames.


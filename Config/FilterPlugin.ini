[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll
;
; BuildPlugin's own default filter takes /Source, /Content, /Resources, /Shaders and
; /Binaries/ThirdParty (BuildPluginCommand.Automation.cs, FilterPluginFiles) -- and nothing else. So
; everything below has to be named or it is simply absent from the packaged plugin.
; The plugin's CoreRedirects, applied by the engine from the "DreamGUI" config branch.
/Config/DefaultDreamGUI.ini
; The one config file here the engine actually layers into a global branch: it puts /DreamGUI into
; DirectoriesToAlwaysCook so an explicit-package-list cook still gets the plugin's default assets.
; Absent from the package, every such cook ships a blank UI.
/Config/Game.ini
/README.md
; The migration guide the README sends people to, and the reference it names, printed from reflection.
/Docs/Migration.md
/Docs/Reference/...
; MIT: the notice travels with any copy or substantial portion, and a BuildPlugin output is a copy.

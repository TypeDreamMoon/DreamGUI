; Plugin-shipped defaults for DreamGUI's own settings sections.
;
; DO NOT PUT [CoreRedirects] HERE. This file is mounted by the plugin manager during AppInit, and
; InitUObject has already read every CoreRedirect out of GConfig by then -- LoadCoreModules runs
; before AppInit -- so a redirect written here is never applied. It is not inert-but-harmless: it
; reads as a safety net that is not there. One of the entries that used to live here pointed a
; presenter-component class that did exist at a prefab-era name that never had, which is the exact
; shape that makes an asset fail to load with "because its class does not exist"; it also ran the
; opposite way to an entry the engine config next door already carried, and CoreRedirects would not
; have chained the pair even if this file had been read. Both of those classes have since been
; deleted outright, and the entries naming them went with them.
;
; Redirects belong in Config/DefaultEngine.ini next to this file, which is the block README tells you
; to copy into your project's config. The ones that used to be here were moved there on 2026-09-15.

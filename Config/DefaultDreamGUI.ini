; DreamGUI's plugin-shipped config: the CoreRedirects every project using the plugin needs, so that assets
; saved against older names -- LGUI, LexUI, and the renames inside this fork -- still load.
;
; THE ENGINE APPLIES THESE, before the first package loads. The plugin manager mounts this file as the
; "DreamGUI" config branch during AppInit, and InitUObject -- bound to FCoreDelegates::OnInit, which AppInit
; broadcasts only at its very end -- reads the [CoreRedirects] section of every config branch there is,
; this one included. Checked against UE 5.8 on 2026-09-27: started with
; -LogCmds="LogCoreRedirects Verbose", the editor logs "AddRedirect(.../DreamGUI.ini) adding N redirects"
; among the engine's own branches, before any asset is loaded. So a project no longer copies anything.
;
; A project that did copy the old block into its own Config/DefaultEngine.ini should delete that copy.
; Two entries for one OldName with different NewNames are an error, and the first registered wins; this
; branch is read before the project's Engine branch, so a stale copy is dead weight at best.
;
; The block below is the one that used to ship as Config/DefaultEngine.ini for projects to copy, carried
; over entry for entry. Its LGUI/LexUI part was generated by the rename; everything is maintained by hand
; now. The tests in DreamPackagingAndUndoAutomationTests.cpp read this file: that its entries reach the
; engine, that no OldName is still a live type, that no NewName hops into another redirect, and that
; every NewName in DreamGUI's own modules exists.

[CoreRedirects]
; ---------------------------------------------------------------------------
; P4-d, 2026-08-29. NOT generated by gen_redirects.py (that one maps LGUI/LexUI
; to Dream); these are the second rename, from the prefab vocabulary the class
; model replaced. Hand-written, and hand-written is the point: every entry below
; is a type some already-saved asset still names, and a missing one costs data
; the moment that asset is resaved.
;
; A redirect whose target does not exist is not a harmless leftover: it rewrites the
; reference and THEN fails to resolve it, which reads as "its class does not exist" on
; an asset that would otherwise have failed more honestly. So entries lose their place
; here the moment their target class does -- the presenter component and the
; raycaster-source family with the world-space rework, the prefab types that went
; with the prefab machinery long before it, and the two structs of the canvas's
; material-instance pools with the pools (only transient properties ever held them).
; Levels that still place those actors have to be re-laid-out by hand; that break was
; accepted.
;
; DreamGUI.Packaging.EveryRedirectTargetExists is what keeps that true: every NewName in
; this file that names a type in one of DreamGUI's own modules -- class, struct, enum, delegate
; signature or function -- is looked up in the running process.
;
; A class moving out of the plugin's shipped modules counts as its target going away. The
; counters, probes and stand-in behaviours the automated tests declare used to be compiled into
; DreamGUI and DreamGUIEditor, and the rename swept them up with everything else; they now live
; in the test module, so /Script/DreamGUI.<name> no longer resolves to them and their entries
; are gone. Nothing was ever saved naming one -- a test type is created in memory and dies with
; the test -- so there is no asset to rescue, and pointing a shipped plugin's config at a class
; that only exists in an editor test module would be wrong even if there were. If these entries
; reappear, whatever regenerated them enumerated the test module too.
+ClassRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequence",NewName="/Script/DreamGUI.DreamWidgetAnimation")
+ClassRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequenceComponent",NewName="/Script/DreamGUI.DreamWidgetAnimationComponent")
+ClassRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequencePlayer",NewName="/Script/DreamGUI.DreamWidgetAnimationPlayer")
+ClassRedirects=(OldName="/Script/DreamGUIEditor.DreamUIPrefabEdMode",NewName="/Script/DreamGUIEditor.DreamWidgetDesignerEdMode")
+ClassRedirects=(OldName="/Script/DreamGUIEditor.DreamUIPrefabSequencerSettings",NewName="/Script/DreamGUIEditor.DreamWidgetAnimationSequencerSettings")
+StructRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequenceObjectReference",NewName="/Script/DreamGUI.DreamWidgetAnimationObjectReference")
+StructRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequenceObjectReferences",NewName="/Script/DreamGUI.DreamWidgetAnimationObjectReferences")
+StructRedirects=(OldName="/Script/DreamGUI.DreamUIPrefabSequenceObjectReferenceMap",NewName="/Script/DreamGUI.DreamWidgetAnimationObjectReferenceMap")

; 2026-09-08. UDreamUINavigationScope's BlueprintImplementableEvents lost their "On": the
; Angelscript binder strips "Receive" and the script name collided with the OnScopeActivated /
; OnScopeDeactivated delegates. A Blueprint subclass that overrides the event stores the
; function name, so it needs the hop; the delegates kept their names and need nothing.
+FunctionRedirects=(OldName="DreamUINavigationScope.ReceiveOnScopeActivated",NewName="DreamUINavigationScope.ReceiveScopeActivated")
+FunctionRedirects=(OldName="DreamUINavigationScope.ReceiveOnScopeDeactivated",NewName="DreamUINavigationScope.ReceiveScopeDeactivated")

; 2026-09-15. The control-suffix drop (UIButtonComponent -> UIButton and its thirteen siblings) and
; the Update -> Tick rename on UDreamUIBehaviour, so an asset or a Blueprint override saved before
; those renames needs them. They lived in this file before, were moved out to the project-copy
; template on the belief that this file is read too late, and are back with everything else.
+ClassRedirects=(OldName="/Script/DreamGUI.UIButtonComponent",NewName="/Script/DreamGUIControls.UIButton")

; Cook reachability for the plugin's own default assets.
;
; THIS FILE IS READ BY THE ENGINE, unlike DefaultEngine.ini next to it. A plugin layers into a global
; config branch with a file named for the BRANCH -- FConfigCacheIni::AddPluginsToBranches takes each
; .ini in a plugin's Config dir and looks the branch up by the file's base name, so "Game.ini" lands
; in the Game branch, which is where UProjectPackagingSettings (UCLASS(config=Game)) lives. A file
; called DefaultGame.ini would find no branch named "DefaultGame" and be skipped.
;
; WHY IT IS NEEDED. Every asset DreamGUI reaches for by itself -- the default material, font, sprite
; presets, the rect-block data, the navigation handler -- is a TSoftObjectPtr assigned to the NATIVE
; CDO in UDreamGUISettings::UDreamGUISettings(). A native CDO lives in /Script/DreamGUI and never
; enters the asset registry, so those soft pointers produce no package dependency for the cooker to
; follow, and neither do the config values that override them. They survive an ordinary cook only
; because UE cooks all mounted content by default (CookOnTheFlyServer's bCookAllByDefault). Under a
; cook driven by an explicit package list -- -map=, a DLC or chunk cook, MapsToCook,
; -SkipSoftReferences -- none of them is pulled in, UDreamGUISettings::LoadSetting logs "failed to
; load" for each, and the whole UI draws blank.
;
; Naming the content root here is what the cooker reads (CookOnTheFlyServer.cpp, the
; DirectoriesToAlwaysCook loop), and shipping it with the plugin means a project gets it by enabling
; the plugin rather than by knowing to add a line. This is the same thing engine plugins do; see
; Engine/Plugins/NNE/NNEDenoiser/Config/Game.ini.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/DreamGUI")

; DreamGUI test host -- engine config.
;
; This host stands in for DevTest (I:\UnrealProject_Moon\DEV_58\DevTest), the project the suite used to
; be run from. Every section below says where it came from. Values taken from DevTest's
; Config/DefaultEngine.ini are copied verbatim, because several of them feed the shader cache keys:
; a host that agrees with DevTest on them reads DevTest's already-warm derived data cache instead of
; compiling every shader again on its first launch.
;
; There is deliberately no derived-data-cache section. On this engine the cache that is actually read
; and written is the local Zen store, which is machine-wide rather than per project (BaseEngine.ini,
; [Zen.AutoLaunch] DataPath and the ue.ddc namespace); the per-project FileSystem store is configured
; DeleteOnly and takes no reads or writes. Leaving the cache graph alone is exactly what makes this
; host share DevTest's cache -- anything written here could only split the two. Tools/TestHost/README.md
; says where that cache lives on disk.

[/Script/EngineSettings.GameMapsSettings]
; The lightest map the engine ships that still gives the editor a level to render: one PlayerStart.
; The engine default (/Engine/Maps/Templates/OpenWorld) is a World Partition landscape, and DevTest
; starts on a full showcase level that every run -- -nullrhi included -- loaded before its first test.
; The pixel tests only need the editor to have a world and a viewport that renders it, not anything
; in the world.
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry

[/Script/Engine.Engine]
; What a correctly configured DreamGUI game has (README, "Keyboard layouts"): characters reach a text
; field through the viewport client's InputChar instead of the plugin's key-to-character table, which
; is only right on a US layout. DevTest does not set this, so a test that depends on which character
; road is live must set that road up itself rather than inherit it from the project.
GameViewportClientClassName=/Script/DreamGUI.DreamGameViewportClient

[/Script/Engine.RendererSettings]
; Copied verbatim from DevTest. These feed the shader map keys; one value different here and the
; first launch compiles its shaders from nothing.
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
; DevTest turned this off for masked decals that sit coplanar with its character faces; kept only so
; the shader keys stay the same.
r.EarlyZPassOnlyMaterialMasking=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
r.CustomDepth=3
r.RayTracing.Shadows=True
r.Mobile.AntiAliasing=4
r.AntiAliasingMethod=4

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Copied from DevTest: the RHI and the targeted shader formats decide which shader platform the editor
; compiles for, and the platform is part of every shader cache key. The audio settings that follow
; these lines in DevTest are the Blank template's defaults and have nothing to do with the suite.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/Engine.UserInterfaceSettings]
; Copied from DevTest, where the New Project wizard wrote it (GameProjectUtils.cpp,
; AddUserInterfaceEngineConfigValues); the class defaults are 96 DPI and automatic variables on.
; DreamGUI itself reads only the DPI scale curve, which neither project changes -- these three keep the
; UMG side of the parity tests identical between the two projects. FontDPI names no property any more
; (it is CustomFontDPI now); the wizard still writes it, so it is copied as it is.
bAuthorizeAutomaticWidgetVariableCreation=False
FontDPIPreset=Standard
FontDPI=72

[/Script/DreamGUI.DreamUISettings]
; Copied from DevTest. MSAA is not the class default (None), and it changes what every DreamUI renderer
; path -- the RenderTarget canvases the pixel tests read included -- writes into its target. DevTest's
; third key, LayoutMode=UMGCompatible, is left out: no property of that name exists any more, so it is
; inert there and would only mislead here.
AntiAliasingMethod=MSAA
MSAASampleCount=Four

[/Script/Engine.MoonToonSettings]
; This engine's toon subsystem loads two ramp atlases at engine start (UMoonToonSubsystem::Initialize).
; Their /MoonToon mount belongs to DevTest's own MoonToon project plugin, which this host does not
; carry, so the defaults would only log two failed loads on every launch. None skips the load; the
; renderer binds its black fallback texture for a null atlas, exactly as it would after a failed load.
GlobalDiffuseColorRampAtlas=None
GlobalSpecularColorRampAtlas=None

[DevOptions.Shaders]
; Copied from DevTest: same machine, 24 cores and no hyper-threading, so reserving 25% leaves 18
; shader compile workers instead of the engine default's 12.
PercentageUnusedShaderCompilingThreads=25

; [CoreRedirects] is appended here by New-DreamGUITestHost.ps1, entry for entry from
; Plugins/DreamGUI/Config/DefaultEngine.ini -- the block the plugin's README tells a project to copy.
; A project needs it even with no content of its own: the plugin still ships assets saved under their
; LGUI class names (NavigationSelection_Sprite, which the default navigation-selection widget
; references, and DefaultFont_Bitmap), and the engine reads redirects only from the project's config.
; Keep the marker line below as the last line of this file.
;@@DREAMGUI_CORE_REDIRECTS@@

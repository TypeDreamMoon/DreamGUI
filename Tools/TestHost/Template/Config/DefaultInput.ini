; DreamGUI test host -- input config.

[/Script/Engine.InputSettings]
; Copied from DevTest, whose DefaultInput.ini got them from the Blank template. The engine's own
; defaults are UPlayerInput and UInputComponent (UInputSettings' constructor), and with those the
; Enhanced Input path is dead on arrival: ADreamEnhancedInputEventSystemActor refuses to bind its
; mouse actions to anything but a UEnhancedInputComponent, and the Enhanced Input local player
; subsystem applies no mapping context unless the controller's PlayerInput is a UEnhancedPlayerInput.
; The rest of DevTest's DefaultInput.ini is the template restating engine defaults, and is not copied.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

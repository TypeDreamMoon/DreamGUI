; DreamGUI's own translations, kept with DreamLoc: the plugin's editor UI (its LOCTEXTs) and its reflected types'
; display names, tooltips and categories. `dloc sync -Gather -Plugin DreamGUI` brings DLoc/<culture>/ up to date with
; the source; `dloc bake -Plugin DreamGUI` writes Content/Localization/DreamGUI*, which the editor reads with or
; without DreamLoc in the project.
[DreamLoc]
SourceCulture=en
TargetCultures=zh-Hans

[Gather]
ExcludePaths=Source/DreamGUITests/*, Content/Developers/*, Content/Localization/*
EditorOnlyData=true
MetaData=true

[Publish]
LoadingPolicy=Editor

[Translate]
BatchSize=12
Concurrency=8
Style=DLoc/_style.md

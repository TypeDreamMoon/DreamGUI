<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">DreamGUI</title>
  <desc id="d">DreamGUI — a 3D UI system for Unreal Engine 5.8: panels of UI standing in a scene at different depths.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="0.55" stop-color="#10224a"/>
      <stop offset="1" stop-color="#1a3b8f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#22c8e8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8fb0ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- the floor the panels stand on, in perspective -->
  <g stroke="#8fb0ff" stroke-opacity="0.18" stroke-width="1">
    <path d="M640 320 L880 214 M760 320 L940 214 M880 320 L1000 214 M1000 320 L1060 214 M1120 320 L1120 214 M1240 320 L1180 214"/>
    <path d="M700 290 H1280 M760 262 H1280 M812 238 H1280 M858 220 H1280"/>
  </g>

  <!-- a loading ring behind the card -->
  <g transform="translate(1080 128)" fill="none" stroke-linecap="round">
    <circle r="88" stroke="#ffffff" stroke-opacity="0.08" stroke-width="22"/>
    <path d="M0 -88 A88 88 0 0 1 84 -26" stroke="#2f6bff" stroke-opacity="0.75" stroke-width="22"/>
    <path d="M70 52 A88 88 0 0 1 -60 64" stroke="#2f6bff" stroke-opacity="0.55" stroke-width="22"/>
    <path d="M-86 18 A88 88 0 0 1 -40 -78" stroke="#22c8e8" stroke-opacity="0.5" stroke-width="22"/>
  </g>

  <!-- the card, turned toward the reader -->
  <g transform="matrix(0.94 -0.12 0 1 840 70)">
    <rect width="260" height="196" rx="16" fill="url(#panel)" stroke="#8fb0ff" stroke-opacity="0.45"/>
    <circle cx="26" cy="28" r="6" fill="#2f6bff"/>
    <rect x="42" y="23" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.75"/>
    <rect x="206" y="20" width="34" height="16" rx="8" fill="#ffaa33" fill-opacity="0.85"/>
    <path d="M18 50 H242" stroke="#8fb0ff" stroke-opacity="0.35"/>
    <rect x="22" y="70" width="96" height="8" rx="4" fill="#c7d4f0" fill-opacity="0.55"/>
    <rect x="196" y="64" width="44" height="20" rx="10" fill="#2f6bff"/>
    <circle cx="230" cy="74" r="7" fill="#ffffff"/>
    <rect x="22" y="104" width="70" height="8" rx="4" fill="#c7d4f0" fill-opacity="0.55"/>
    <rect x="130" y="106" width="110" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="130" y="106" width="70" height="5" rx="2.5" fill="url(#button)"/>
    <circle cx="200" cy="108.5" r="7" fill="#0b1424" stroke="#2f6bff" stroke-width="2.5"/>
    <rect x="22" y="138" width="96" height="8" rx="4" fill="#c7d4f0" fill-opacity="0.55"/>
    <rect x="130" y="130" width="110" height="24" rx="6" fill="none" stroke="#8fb0ff" stroke-opacity="0.5"/>
    <rect x="22" y="166" width="218" height="20" rx="8" fill="url(#button)"/>
  </g>

  <!-- a world-space tag, nearer -->
  <g transform="matrix(0.96 -0.1 0 1 1112 34)">
    <rect width="132" height="46" rx="10" fill="url(#panel)" stroke="#8fb0ff" stroke-opacity="0.45"/>
    <rect x="14" y="14" width="18" height="18" rx="3" fill="none" stroke="#ffaa33" stroke-width="2.5" transform="rotate(45 23 23)"/>
    <rect x="44" y="15" width="74" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.7"/>
    <rect x="44" y="27" width="46" height="6" rx="3" fill="#c7d4f0" fill-opacity="0.45"/>
  </g>

  <!-- the .dui it was written in -->
  <g transform="matrix(0.96 -0.1 0 1 742 214)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
    <rect width="168" height="78" rx="10" fill="#0b1424" fill-opacity="0.8" stroke="#8fb0ff" stroke-opacity="0.4"/>
    <text x="12" y="22" fill="#ffaa33">Native.Button</text>
    <text x="110" y="22" fill="#c7d4f0">Apply {</text>
    <text x="24" y="42" fill="#8fb0ff">OnClicked</text>
    <text x="96" y="42" fill="#c7d4f0">-&gt; Save</text>
    <text x="12" y="62" fill="#c7d4f0">}</text>
  </g>

  <!-- the name -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="150" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="-1">Dream<tspan fill="#5b8cff">GUI</tspan></text>
    <text x="76" y="196" fill="#c7d4f0" font-size="24">A 3D UI system for Unreal Engine 5.8</text>
    <text x="76" y="236" fill="#8fa3c8" font-size="16" letter-spacing="1.5">SCREEN SPACE · WORLD SPACE · WIDGET BLUEPRINTS · .DUI</text>
  </g>
</svg>

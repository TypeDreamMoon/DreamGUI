<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-labelledby="t d">
  <title id="t">DreamGUI</title>
  <desc id="d">Panels of UI standing in a scene at different depths, turned toward the viewer: a settings card, a world-space tag, a loading ring and the .dui source.</desc>
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#2f6bff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4d"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#22c8e8"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="210" r="200" fill="url(#halo)"/>
  <ellipse cx="200" cy="462" rx="150" ry="22" fill="url(#floor)"/>
  <ellipse cx="200" cy="462" rx="168" ry="32" fill="none" stroke="#22c8e8" stroke-opacity="0.4"/>

  <!-- loading ring, furthest back -->
  <g transform="translate(262 170) scale(0.82 1)" fill="none" stroke-linecap="round">
    <circle r="96" stroke="#2f6bff" stroke-opacity="0.12" stroke-width="26"/>
    <path d="M0 -96 A96 96 0 0 1 92 -28" stroke="#2f6bff" stroke-opacity="0.7" stroke-width="26"/>
    <path d="M76 58 A96 96 0 0 1 -66 70" stroke="#2f6bff" stroke-opacity="0.5" stroke-width="26"/>
    <path d="M-94 20 A96 96 0 0 1 -44 -85" stroke="#22c8e8" stroke-opacity="0.45" stroke-width="26"/>
  </g>

  <!-- the settings card -->
  <g transform="matrix(0.9 -0.14 0 1 70 120)">
    <rect width="250" height="290" rx="18" fill="url(#card)" stroke="#5b8cff" stroke-opacity="0.55"/>
    <circle cx="28" cy="32" r="7" fill="#2f6bff"/>
    <rect x="46" y="26" width="104" height="12" rx="6" fill="#e6ecfa"/>
    <rect x="190" y="23" width="40" height="18" rx="9" fill="#ffaa33"/>
    <path d="M20 58 H230" stroke="#5b8cff" stroke-opacity="0.35"/>
    <rect x="22" y="84" width="92" height="9" rx="4.5" fill="#9fb0d4"/>
    <rect x="182" y="78" width="48" height="22" rx="11" fill="#2f6bff"/>
    <circle cx="219" cy="89" r="8" fill="#ffffff"/>
    <rect x="22" y="130" width="66" height="9" rx="4.5" fill="#9fb0d4"/>
    <rect x="120" y="132" width="110" height="6" rx="3" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="120" y="132" width="72" height="6" rx="3" fill="url(#button)"/>
    <circle cx="192" cy="135" r="8" fill="#101a33" stroke="#2f6bff" stroke-width="3"/>
    <rect x="22" y="176" width="92" height="9" rx="4.5" fill="#9fb0d4"/>
    <rect x="120" y="166" width="110" height="28" rx="7" fill="none" stroke="#5b8cff" stroke-opacity="0.6"/>
    <path d="M208 176 l6 6 l6 -6" fill="none" stroke="#9fb0d4" stroke-width="2"/>
    <rect x="22" y="222" width="70" height="9" rx="4.5" fill="#9fb0d4"/>
    <rect x="120" y="218" width="16" height="16" rx="4" fill="#2f6bff"/>
    <rect x="144" y="218" width="16" height="16" rx="4" fill="none" stroke="#5b8cff" stroke-opacity="0.6"/>
    <rect x="22" y="252" width="208" height="24" rx="9" fill="url(#button)"/>
  </g>

  <!-- a world-space tag, nearer -->
  <g transform="matrix(0.94 -0.12 0 1 222 64)">
    <rect width="150" height="54" rx="11" fill="url(#card)" stroke="#5b8cff" stroke-opacity="0.6"/>
    <rect x="17" y="17" width="20" height="20" rx="3" fill="none" stroke="#ffaa33" stroke-width="3" transform="rotate(45 27 27)"/>
    <rect x="52" y="18" width="82" height="8" rx="4" fill="#e6ecfa"/>
    <rect x="52" y="32" width="52" height="7" rx="3.5" fill="#9fb0d4"/>
  </g>

  <!-- the .dui source, nearest -->
  <g transform="matrix(0.94 -0.12 0 1 26 352)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">
    <rect width="190" height="84" rx="11" fill="#0b1424" stroke="#5b8cff" stroke-opacity="0.55"/>
    <text x="14" y="24" fill="#ffaa33">Native.Button</text>
    <text x="122" y="24" fill="#c7d4f0">Apply {</text>
    <text x="28" y="46" fill="#8fb0ff">OnClicked</text>
    <text x="106" y="46" fill="#c7d4f0">-&gt; Save</text>
    <text x="14" y="68" fill="#c7d4f0">}</text>
  </g>
</svg>
